<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0f2"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#c0c0c6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Sky dots pattern -->
  <g opacity="0.15">
    <circle cx="120" cy="80" r="30" fill="#a1a1aa"/>
    <circle cx="680" cy="120" r="20" fill="#a1a1aa"/>
    <circle cx="400" cy="60" r="15" fill="#a1a1aa"/>
  </g>
  <!-- Main building -->
  <rect x="280" y="160" width="240" height="260" rx="8" fill="url(#building)" opacity="0.6"/>
  <!-- Building windows -->
  <g fill="#a1a1aa" opacity="0.35">
    <rect x="305" y="190" width="35" height="30" rx="4"/>
    <rect x="355" y="190" width="35" height="30" rx="4"/>
    <rect x="405" y="190" width="35" height="30" rx="4"/>
    <rect x="455" y="190" width="35" height="30" rx="4"/>
    <rect x="305" y="240" width="35" height="30" rx="4"/>
    <rect x="355" y="240" width="35" height="30" rx="4"/>
    <rect x="405" y="240" width="35" height="30" rx="4"/>
    <rect x="455" y="240" width="35" height="30" rx="4"/>
    <rect x="305" y="290" width="35" height="30" rx="4"/>
    <rect x="355" y="290" width="35" height="30" rx="4"/>
    <rect x="405" y="290" width="35" height="30" rx="4"/>
    <rect x="455" y="290" width="35" height="30" rx="4"/>
    <rect x="305" y="340" width="35" height="30" rx="4"/>
    <rect x="355" y="340" width="35" height="30" rx="4"/>
    <rect x="405" y="340" width="35" height="30" rx="4"/>
    <rect x="455" y="340" width="35" height="30" rx="4"/>
  </g>
  <!-- Door -->
  <rect x="375" y="380" width="50" height="40" rx="4" fill="#a1a1aa" opacity="0.4"/>
  <!-- Side building -->
  <rect x="520" y="240" width="120" height="180" rx="6" fill="url(#building)" opacity="0.4"/>
  <g fill="#a1a1aa" opacity="0.25">
    <rect x="540" y="265" width="30" height="25" rx="3"/>
    <rect x="590" y="265" width="30" height="25" rx="3"/>
    <rect x="540" y="310" width="30" height="25" rx="3"/>
    <rect x="590" y="310" width="30" height="25" rx="3"/>
    <rect x="540" y="355" width="30" height="25" rx="3"/>
    <rect x="590" y="355" width="30" height="25" rx="3"/>
  </g>
  <!-- Small building -->
  <rect x="160" y="300" width="120" height="120" rx="6" fill="url(#building)" opacity="0.35"/>
  <g fill="#a1a1aa" opacity="0.2">
    <rect x="180" y="320" width="25" height="22" rx="3"/>
    <rect x="220" y="320" width="25" height="22" rx="3"/>
    <rect x="180" y="358" width="25" height="22" rx="3"/>
    <rect x="220" y="358" width="25" height="22" rx="3"/>
  </g>
  <!-- Ground line -->
  <rect x="100" y="420" width="600" height="3" rx="1.5" fill="#d4d4d8" opacity="0.5"/>
  <!-- Camera icon -->
  <g transform="translate(370, 460)" opacity="0.4">
    <rect x="0" y="8" width="60" height="42" rx="8" fill="none" stroke="#a1a1aa" stroke-width="2.5"/>
    <circle cx="30" cy="29" r="12" fill="none" stroke="#a1a1aa" stroke-width="2.5"/>
    <rect x="18" y="2" width="24" height="10" rx="4" fill="none" stroke="#a1a1aa" stroke-width="2"/>
  </g>
  <text x="400" y="535" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="14" font-weight="500" fill="#a1a1aa" opacity="0.7">No Image Available</text>
</svg>
